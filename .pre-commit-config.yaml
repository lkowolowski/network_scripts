# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually:
#   pre-commit run --all-files

repos:
  # ── Standard file hygiene ─────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-symlinks
      - id: check-xml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe] # allows YAML anchors
      - id: check-added-large-files
        args: [--maxkb=100]

  # ── ShellCheck — static analysis for shell scripts ───────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shellcheck (zsh files)
        types: [] # override default type filter
        files: '\.(zsh)$'
        args:
          - --severity=warning # error + warning; style is informational only
          - --color=always

  # ── Python — static analysis for shell scripts ───────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # ── yamllint — YAML style and syntax ─────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]
        files: '\.(yml|yaml)$'

  # ── markdownlint — Markdown style ────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yml]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0 # Replace with latest tag
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: "https://github.com/crate-ci/typos"
    rev: v1.39.2
    hooks:
      - id: typos
        args: ["--force-exclude"]
        stages: [commit-msg, pre-commit]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-lint
        # For dbt projects, this installs the dbt "extras".
        # You will need to select the relevant dbt adapter for your dialect
        # (https://docs.getdbt.com/docs/available-adapters):
        # additional_dependencies: ['<dbt-adapter>', 'sqlfluff-templater-dbt']
      - id: sqlfluff-fix
        # Arbitrary arguments to show an example
        # args: [--rules, "LT02,CP02"]
        # additional_dependencies: ['<dbt-adapter>', 'sqlfluff-templater-dbt']

  # ── Bats test suite ─────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: bats
        name: bats
        language: system
        entry: bash -c 'if [ -d tests ]; then exec bats tests/; fi' --
        pass_filenames: false
        always_run: true
